[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schoolapp-watcher"
version = "0.2.0"
description = "Semester-based ENSAM SchoolApp CLI with watch, calculator, and notifications."
requires-python = ">=3.10"
dependencies = [
  "requests==2.32.5",
  "beautifulsoup4==4.12.3",
  "rich==13.9.4",
  "typer==0.16.0",
  "tomli==2.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
schoolapp = "schoolapp.cli:app"
schoolapp-watch = "schoolapp.cli:app"

[tool.setuptools]
py-modules = ["schoolapp_watch"]

[tool.setuptools.package-data]
schoolapp = ["design_tokens.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["schoolapp*"]
