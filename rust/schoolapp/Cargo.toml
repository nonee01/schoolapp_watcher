[package]
name = "schoolapp"
version = "0.1.0"
edition = "2024"
description = "SchoolApp portal client, grade watcher and API"
publish = false

[[bin]]
name = "schoolapp-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"
