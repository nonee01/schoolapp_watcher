[package]
name = "schoolapp"
version = "0.1.0"
edition = "2024"
description = "SchoolApp portal client, grade watcher and API"
publish = false

[[bin]]
name = "schoolapp-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["cookies"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
